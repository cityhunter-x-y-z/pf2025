name: Update GitHub contributions

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-contributions:
    runs-on: ubuntu-latest
    env:
      GH_CONTRIB_TOKEN: ${{ secrets.GH_CONTRIB_TOKEN }}
    steps:
      - name: Skip when the token secret is not set
        if: env.GH_CONTRIB_TOKEN == ''
        run: echo "::warning::GH_CONTRIB_TOKEN repo secret is not set; skipping. contributions.json keeps its last snapshot."

      - uses: actions/checkout@v4
        if: env.GH_CONTRIB_TOKEN != ''

      - name: Fetch contribution calendar
        if: env.GH_CONTRIB_TOKEN != ''
        run: |
          curl -sS -H "Authorization: bearer ${GH_CONTRIB_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"query":"query { user(login: \"cityhunter-x-y-z\") { contributionsCollection { contributionCalendar { totalContributions weeks { contributionDays { date contributionCount } } } } } }"}' \
            https://api.github.com/graphql > raw-contributions.json

      - name: Build static contributions.json
        if: env.GH_CONTRIB_TOKEN != ''
        run: node packages/personal-doc/scripts/build-contributions.mjs raw-contributions.json packages/personal-doc/public/contributions.json

      - name: Clean up
        if: env.GH_CONTRIB_TOKEN != ''
        run: rm -f raw-contributions.json

      - name: Commit if changed
        if: env.GH_CONTRIB_TOKEN != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add packages/personal-doc/public/contributions.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh GitHub contribution data"
            git push
          else
            echo "No contribution data changes."
          fi
